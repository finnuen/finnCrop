[package]
name = "finnCrop"
version = "1.9.0"
edition = "2021"
description = "Tiny native video cropper and lossless cutter (FFmpeg is packed inside)"
license = "Apache-2.0"
authors = ["finnuen"]
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.15", default-features = false }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
