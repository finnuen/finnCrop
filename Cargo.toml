[package]
name = "finnCrop"
version = "1.14.0"
edition = "2021"
description = "Tiny native video cropper and lossless cutter (FFmpeg is packed inside)"
license = "Apache-2.0"
authors = ["finnuen"]
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.15", default-features = false }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

# Windows' own HTTP stack, for the update check: it brings its TLS, so the
# program ships no certificate code and needs nothing installed beside it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
